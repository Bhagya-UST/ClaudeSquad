<svg width="192" height="192" viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded rectangle background -->
  <rect width="192" height="192" rx="32" fill="url(#bgGradient)"/>

  <!-- Activity Icon (pulse/chart lines) -->
  <g transform="translate(48, 48)">
    <!-- Left pulse line -->
    <polyline points="0,64 16,48 24,56 32,32" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Middle pulse line -->
    <polyline points="48,64 64,48 72,56 80,32 88,48 96,40" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  </g>
</svg>
